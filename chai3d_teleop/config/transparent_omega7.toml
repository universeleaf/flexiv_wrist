# CHAI3D omega.7 -> Flexiv Rizon4s 保存配置
# 这是当前已验证、用户确认满意的全工作空间 / 低延迟 / 1:1 力反馈配置。

[robot]
# Flexiv 机器人序列号。
robot_sn = "Rizon4s-123456"
# 电脑上连接 Flexiv 控制网络的本机网卡 IP，不是机器人 IP。
network_interface_ip = "127.0.0.1"

[haptic]
# CHAI3D 设备和 clutch/user-switch 编号。
device = 0
switch = 0
# omega.7 位置读取和力输出循环频率。设备官方最高支持 4 kHz；这里使用 1 kHz。
device_rate = 1000
# 显式启用 DHD 重力补偿；零反馈力时也会支撑设备手柄自身重量。
gravity_compensation = true
# 启动时不主动拉向 CHAI3D 坐标 [0,0,0]；把启动前手柄所在的物理中间位置
# 作为初始保持位置，避免运行脚本后手柄跳到另一个“默认位置”。
startup_center = false
# clutch 松开后停止机器人遥操作并归零用户反馈力，但继续运行 DHD 重力补偿。
# 这样手柄在无人施力时保持平衡，手推时仍可自由移动，不使用 DRD 刚性位置锁定。
hold_when_released = false
# 以下参数仅供 startup_center=true 的旧弹簧兼容模式使用；当前 DRD 保持不会使用它们。
hold_stiffness = 150.0
hold_damping = 5.0
hold_max_force = 4.0
hold_slew_rate = 20.0
# CHAI3D X/Y 反向映射到 Flexiv world，Z 保持同向。
axis_map = "-x,-y,z"

[motion]
# Flexiv NRT 离散目标发送频率上限为 100 Hz。
command_rate = 100
# 设备平移 1 mm，机器人 TCP 目标平移 2 mm。
scale = 2.0
# 关闭单次 clutch 和整次运行相对启动点的平移范围检查。
unlimited_translation = true
# 关闭应用层每周期平移目标步长限制。
unlimited_step = true
# Flexiv RDK 1.9 SendCartesianMotionForce 的运动生成器参数。
max_linear_velocity = 0.5
max_angular_velocity = 1.0
max_linear_acceleration = 2.0
max_angular_acceleration = 5.0

[rotation]
# 映射 omega.7 手柄姿态。
enable_rotation = true
# 关闭单次 clutch 和整次运行的累计角度范围检查。
unlimited_rotation = true
# 关闭应用层每周期姿态目标步长限制。
unlimited_angular_step = true

[force_feedback]
# 把 Flexiv world-frame TCP 外力反馈到 omega.7。
enable_force_feedback = true
# 使用 Flexiv 补偿并滤波后的 world-frame TCP 外力。raw 信号在 1:1 回传时会把
# 传感器噪声和未建模工具动力学直接送到 omega.7，容易造成持续振动。
force_feedback_source = "filtered"
# 100 Hz NRT 双边链路在 1.0 增益下已实测出现自激振动；先用 0.25 稳定基线。
# 稳定验证后只能逐步增加，不能直接恢复 1.0。
force_feedback_gain = 0.25
# 去除静止时约 0.5 N 范围内的残余噪声。
force_feedback_deadband = 0.5
# omega.7 连续额定输出为 12 N。这里只做硬件饱和，不会因达到 12 N 退出遥操作。
max_device_force = 12.0
# 0 表示初始 bias 过大时只警告、不因力值退出。仍会记录 bias；应确保 payload 正确。
max_force_feedback_bias = 0.0
# 减缓 100 Hz wrench 阶跃，避免再次激发 omega.7 振动。
force_slew_rate = 20.0
# 在 omega.7 的 1 kHz 本地循环加入速度阻尼；静止时阻尼力为零，因此不改变静态力增益。
teleop_damping = 12.0
# 15 N 以下保持 0.25x；超过 15 N 后逐渐增强反弹，并增加速度阻尼。
# 这些参数只改变触觉输出，不会因为超过 4 N、15 N 或达到 12 N 饱和而退出程序。
overload_threshold = 15.0
overload_gain = 0.8
overload_full_damping_excess = 5.0
overload_damping = 20.0
# 实机力反馈的显式确认字符串。
confirm_force_feedback = "FORCE_1_TO_1"

[runtime_safety]
# CHAI3D 数据或反馈命令超过 100 ms 未更新时停止/归零。
watchdog_ms = 100.0
# 允许连接真实机器人并发送运动命令。
arm = true
# 真实 Flexiv 运动的显式确认字符串。
confirm = "MOVE_RIZON"
